name: Release

# Fires on version tags pushed by `npm run release` (scripts/release.mjs),
# e.g. v1.4.0. Builds, tests, and publishes a GitHub Release with the
# single-file build attached under a fixed filename, so
# .../releases/latest/download/c3pu.html always points at the newest build.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Prepare release asset
        run: cp dist/index.html c3pu.html

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: c3pu.html
